name: Wiqo Desktop

on:
  push:
    paths:
      - "desktop/**"
      - "contracts/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "contracts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# The same checks on the three systems the desktop runs on: the platform-specific code (power, volume, applications, screen) is only compiled and tested on its own system.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux libraries (screen capture, clipboard, the Tauri window)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libclang-dev libxdo-dev libwayland-dev libegl1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test


  # Branch builds produce QA artifacts. Publishing requires the verified Windows publisher and the updater key.
  windows-package:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      SIGN_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WIQO_WINDOWS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Helper that drives other apps (agent-desktop)
        shell: bash
        run: ../scripts/build-helper.sh ${{ matrix.target }} binaries
      - name: Artifact Signing CLI
        if: env.SIGN_RELEASE == 'true'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked
      - name: Build the installer
        shell: pwsh
        env:
          WIQO_HELPER: ${{ github.workspace }}\desktop\app\binaries\agent-desktop.exe
          WIQO_BROWSER_WORKER_DIR: ${{ github.workspace }}\desktop\browser-worker
          WINDOWS_TARGET: ${{ matrix.target }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WIQO_WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WIQO_WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WIQO_WINDOWS_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ env.SIGN_RELEASE == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.SIGN_RELEASE == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ env.SIGN_RELEASE == 'true' && secrets.AZURE_TENANT_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.SIGN_RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = @{ bundle = @{ createUpdaterArtifacts = $false } }
          if ($env:SIGN_RELEASE -eq 'true') {
            foreach ($name in @('WINDOWS_SIGNING_ENDPOINT', 'WINDOWS_SIGNING_ACCOUNT', 'WINDOWS_SIGNING_PROFILE', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID', 'TAURI_SIGNING_PRIVATE_KEY')) {
              if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing configuration: $name" }
            }
            $signArgs = @('-e', $env:WINDOWS_SIGNING_ENDPOINT, '-a', $env:WINDOWS_SIGNING_ACCOUNT, '-c', $env:WINDOWS_SIGNING_PROFILE, '-d', 'Wiqo')
            & artifact-signing-cli @signArgs $env:WIQO_HELPER
            if ($LASTEXITCODE -ne 0) { throw 'Could not sign the desktop helper.' }
            $config.bundle.createUpdaterArtifacts = $true
            $config.bundle.windows = @{ signCommand = @{ cmd = 'artifact-signing-cli'; args = ($signArgs + '%1') } }
          }
          $overrides = Join-Path $env:RUNNER_TEMP 'wiqo-bundle.json'
          $config | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $overrides
          cargo tauri build --target $env:WINDOWS_TARGET --bundles nsis --config $overrides
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the Windows installer.' }
      - name: Collect
        shell: pwsh
        env:
          WINDOWS_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = "../target/$env:WINDOWS_TARGET/release"
          $installers = @(Get-ChildItem "$release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $installer = $installers[0]
          New-Item -ItemType Directory -Path ../../dist -Force | Out-Null
          if ($env:SIGN_RELEASE -eq 'true') {
            foreach ($binary in @($installer.FullName, "$release/Wiqo.exe", 'binaries/agent-desktop.exe')) {
              $signature = Get-AuthenticodeSignature -LiteralPath $binary
              if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
                throw "Missing valid timestamped Authenticode signature: $binary"
              }
            }
            $updaterSignature = Get-Item "$($installer.FullName).sig"
            if ($updaterSignature.Length -eq 0) { throw 'Missing updater signature.' }
            Copy-Item $updaterSignature.FullName ../../dist/
          }
          Copy-Item $installer.FullName ../../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wiqo-windows-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Microsoft Store package (MSIX) for both architectures, joined into one bundle to upload in Partner Center. Unsigned on purpose: the Store signs it.
  windows-msix:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Helper that drives other apps (agent-desktop)
        shell: bash
        run: desktop/scripts/build-helper.sh ${{ matrix.target }} desktop/app/binaries
      - name: Build the package
        shell: pwsh
        run: ./desktop/scripts/build-msix.ps1 -Target ${{ matrix.target }} -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wiqo-msix-${{ matrix.target }}
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 14

  windows-msix-bundle:
    needs: windows-msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wiqo-msix-*
          merge-multiple: true
          path: dist
      - name: Bundle
        shell: pwsh
        run: ./desktop/scripts/bundle-msix.ps1 -Dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wiqo-msixbundle
          path: dist/*.msixbundle
          if-no-files-found: error
          retention-days: 30

  # The everyday tools for real on a fresh Windows and Mac (wiqo-agent selftest): files must pass; the steps that need a desktop session (apps,
  # clipboard, screen) run too and are reported, since CI machines do not always have one.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build -p wiqo-agent
      - name: Files, search, system (must pass)
        env:
          WIQO_DATA_DIR: ${{ runner.temp }}/wiqo-selftest
        run: target/debug/wiqo-agent selftest --headless
      - name: Apps, clipboard, screen (reported)
        continue-on-error: true
        env:
          WIQO_DATA_DIR: ${{ runner.temp }}/wiqo-selftest-full
        run: target/debug/wiqo-agent selftest

  # Driving other apps on Windows (the UI Automation tree through the agent-desktop helper): Notepad is opened and its controls are read for real.
  # Reported only (continue-on-error): a CI machine does not always have an interactive desktop session.
  windows-uia:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Helper
        run: scripts/build-helper.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/helper"
      - name: Open Notepad
        shell: pwsh
        run: Start-Process notepad; Start-Sleep -Seconds 4
      - name: Read Notepad's controls
        env:
          WIQO_AGENT_DESKTOP: ${{ runner.temp }}/helper/agent-desktop.exe
          WIQO_LIVE_APP: Notepad
        run: cargo test -p wiqo-ops live_observation -- --ignored --nocapture

  windows-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WIQO_WINDOWS_SIGNING_ENABLED == 'true'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wiqo-windows-*
          merge-multiple: true
          path: release-assets
      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/app/tauri.conf.json').version")
          TAG="desktop-v$VERSION"
          for architecture in x64 arm64; do
            asset="release-assets/Wiqo_${VERSION}_${architecture}-setup.exe"
            test -s "$asset"
            test -s "$asset.sig"
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Keep the Mac download selected by GitHub's default release link.
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Wiqo Desktop $VERSION (Windows)" \
            --notes "Wiqo $VERSION için imzalı x64 ve ARM64 Windows kurucuları."
