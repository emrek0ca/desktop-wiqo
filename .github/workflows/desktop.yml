name: Wiqo Desktop

on:
  push:
    paths:
      - "desktop/**"
      - "contracts/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "contracts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: An existing release to receive the Windows installers (empty = desktop-v<version>)
        required: false
        type: string

permissions:
  contents: read

# The same checks on the three systems the desktop runs on: the platform-specific code (power, volume, applications, screen) is only compiled and tested on its own system.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux libraries (screen capture, clipboard, the Tauri window)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libclang-dev libxdo-dev libwayland-dev libegl1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test


  # Wiqo for Windows: the NSIS installer (per-user, no admin) and its signed updater archive. Updates are verified with the key in
  # tauri.conf.json, so the repository secret TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) must hold ~/.tauri/wiqo-updater.key.
  # Independent of `check`, so a Linux-only failure never holds back the Windows installer.
  windows-package:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Helper that drives other apps (agent-desktop)
        shell: bash
        run: ../scripts/build-helper.sh ${{ matrix.target }} binaries
      - name: Build the installer
        env:
          WIQO_HELPER: ${{ github.workspace }}\desktop\app\binaries\agent-desktop.exe
          WIQO_BROWSER_WORKER_DIR: ${{ github.workspace }}\desktop\browser-worker
          # The updater signing key is given only to builds of the main branch, so a build of any other branch cannot produce installers the updater trusts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles nsis
      - name: Collect
        shell: bash
        run: |
          mkdir -p ../../dist
          cp ../target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe ../../dist/
          cp ../target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig ../../dist/ 2>/dev/null || echo "no updater signature (secret missing)"
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: wiqo-windows-${{ matrix.target }}
          path: dist/*
          retention-days: 14

  # The everyday tools for real on a fresh Windows and Mac (wiqo-agent selftest): files must pass; the steps that need a desktop session (apps,
  # clipboard, screen) run too and are reported, since CI machines do not always have one.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build -p wiqo-agent
      - name: Files, search, system (must pass)
        env:
          WIQO_DATA_DIR: ${{ runner.temp }}/wiqo-selftest
        run: target/debug/wiqo-agent selftest --headless
      - name: Apps, clipboard, screen (reported)
        continue-on-error: true
        env:
          WIQO_DATA_DIR: ${{ runner.temp }}/wiqo-selftest-full
        run: target/debug/wiqo-agent selftest

  # Driving other apps on Windows (the UI Automation tree through the agent-desktop helper): Notepad is opened and its controls are read for real.
  # Reported only (continue-on-error): a CI machine does not always have an interactive desktop session.
  windows-uia:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Helper
        run: scripts/build-helper.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/helper"
      - name: Open Notepad
        shell: pwsh
        run: Start-Process notepad; Start-Sleep -Seconds 4
      - name: Read Notepad's controls
        env:
          WIQO_AGENT_DESKTOP: ${{ runner.temp }}/helper/agent-desktop.exe
          WIQO_LIVE_APP: Notepad
        run: cargo test -p wiqo-ops live_observation -- --ignored --nocapture

  # A new version (desktop/app/tauri.conf.json "version") pushed to the repository is published by itself as `desktop-v<version>`; the
  # website's download button reads the GitHub releases and picks the newest one with a Windows installer, so nothing else is needed.
  # An existing release (or a tag given by hand) only gets its Windows files replaced.
  windows-release:
    # Only the main branch publishes or replaces a public release; other branches still build and check.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wiqo-windows-*
          merge-multiple: true
          path: release-assets
      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/app/tauri.conf.json').version")
          TAG="${GIVEN_TAG:-desktop-v$VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # A pre-release, so GitHub's "latest" (the Mac download) stays as it is.
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Wiqo Desktop $VERSION (Windows)" \
              --notes "Wiqo masaüstü $VERSION — Windows kurulumu (yönetici izni gerekmez). x64: Wiqo_${VERSION}_x64-setup.exe · ARM64: Wiqo_${VERSION}_arm64-setup.exe"
          fi
