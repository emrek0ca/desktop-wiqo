[package]
name = "wiqo-core"
description = "The desktop runtime: relay connection, pairing, command checks, the execution gate and the ledger. No operations live here."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wiqo-contract = { path = "../wiqo-contract" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
async-trait.workspace = true
tracing.workspace = true
dirs.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
