<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Wiqo</title>
  <link rel="stylesheet" href="cursor.css">
</head>
<body>
  <!-- Wiqo's own cursor. The window lets every click through and is left out of screenshots. -->
  <div id="cursor" hidden>
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 3l18 10.2-7.6 2.2L11.6 23z"/></svg>
    <div id="ripple"></div>
    <div id="label"><span id="words"></span><kbd id="stop"></kbd></div>
  </div>
  <script src="cursor.js"></script>
</body>
</html>
