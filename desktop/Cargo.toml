[workspace]
resolver = "2"
members = ["crates/wiqo-contract", "crates/wiqo-core", "crates/wiqo-ops", "crates/wiqo-agent", "app"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
rand = "0.9"
unicode-normalization = "0.1"
trash = "5"
arboard = { version = "3", default-features = false }
open = "5"
mime_guess = "2"
encoding_rs = "0.8"
dunce = "1"
walkdir = "2"
pdf-extract = "0.7"
lopdf = "0.34"
regex = "1"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.31"
plist = "1"
libloading = "0.8"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xcap = "0.6"

# The default release strip of debug info produces proc-macro dylibs this macOS loader refuses ("mis-aligned LINKEDIT string pool"); stripping is left to bundling.
[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
